<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wx Now tests</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; background: #fff; color: #111; padding: 16px; }
  .pass { color: #0a7a2f; } .fail { color: #b00020; font-weight: bold; }
</style>
</head>
<body>
<h1>Nowcast engine tests</h1>
<p>Synthetic storms with known motion. Open this page to run them.</p>
<ul id="out"></ul>
<script type="module">
import {
  makeField, estimateMotion, pointForecast, hindcast, dbzToRate, RAIN_RATE, velocity,
} from './nowcast.js';
import { visibilityM, describe, pickS2 } from './clarity.js';
import { summarize, changeWindow } from './forecast.js';
import { pastDays, observedDaily, noaaDaily, navyHistDaily, scores } from './history.js';

const out = document.getElementById('out');
const results = [];
function check(name, ok, detail) {
  results.push(ok);
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = `${ok ? 'PASS' : 'FAIL'} — ${name}${detail ? ` (${detail})` : ''}`;
  out.appendChild(li);
}

const W = 300, H = 300, DX = 340 / 300;

// Textured storm cells (so correlation has structure to lock onto), moved by (u, v) px/min.
function stormFrame(cells, minutes, u, v) {
  const dbz = new Float32Array(W * H).fill(NaN);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let best = NaN;
      for (const c of cells) {
        const cx = c.x + u * minutes, cy = c.y + v * minutes;
        const dx = (x - cx) / c.rx, dy = (y - cy) / c.ry;
        const d2 = dx * dx + dy * dy;
        if (d2 > 1) continue;
        const tex = 4 * Math.sin((x - u * minutes) * 0.45) * Math.cos((y - v * minutes) * 0.37);
        const val = c.peak - 25 * d2 + tex;
        if (!(val <= best)) best = val;
      }
      if (best >= 5) dbz[y * W + x] = Math.round(best * 2) / 2;
    }
  }
  return dbz;
}

const T0 = Date.UTC(2026, 0, 1, 12, 0);
function series(cells, u, v, count = 13) {
  const fields = [];
  for (let k = 0; k < count; k++) {
    const minutes = -5 * (count - 1 - k);
    fields.push(makeField(stormFrame(cells, minutes, u, v), W, H, DX, T0 + minutes * 60000));
  }
  return fields;
}

// 1. Marshall-Palmer conversion
check('15 dBZ ≈ 0.32 mm/h', Math.abs(dbzToRate(15) - 0.316) < 0.01, dbzToRate(15).toFixed(3));
check('40 dBZ ≈ 11.5 mm/h', Math.abs(dbzToRate(40) - 11.53) < 0.1, dbzToRate(40).toFixed(2));
check('Below 15 dBZ is dry', dbzToRate(12) === 0);

// 2. Motion recovery: storms moving east-north-east at 50 km/h
const kmh = 50, dir = 70; // toward 70° (ENE)
const pxmin = kmh / 60 / DX;
const u = pxmin * Math.sin(dir * Math.PI / 180), v = -pxmin * Math.cos(dir * Math.PI / 180);
const cells = [
  { x: 60, y: 170, rx: 28, ry: 18, peak: 48 },
  { x: 100, y: 120, rx: 20, ry: 30, peak: 44 },
  { x: 40, y: 230, rx: 35, ry: 15, peak: 40 },
];
const fields = series(cells, u, v);
const recent = fields.filter((f) => f.time >= T0 - 30 * 60000);
let t = performance.now();
const mf = estimateMotion(recent);
const ms = performance.now() - t;
const g = mf.global;
const speed = Math.hypot(g.u, g.v) * DX * 60;
const heading = (Math.atan2(g.u, -g.v) * 180 / Math.PI + 360) % 360;
check('Motion vectors found', mf.count >= 5, `${mf.count} vectors in ${ms.toFixed(0)} ms`);
check('Speed within 10%', Math.abs(speed - kmh) / kmh < 0.1, `${speed.toFixed(1)} km/h vs ${kmh}`);
check('Heading within 8°', Math.abs(heading - dir) < 8, `${heading.toFixed(1)}° vs ${dir}°`);

// 3. Arrival timing: a point downstream of the lead cell
const now = fields[fields.length - 1];
// Cell 1's leading edge reaches this point ~25 min after T0 at the true speed.
const lead = 25;
const px = cells[0].x + u * lead + cells[0].rx * Math.sin(dir * Math.PI / 180) * 0.6;
const py = cells[0].y + v * lead - cells[0].rx * Math.cos(dir * Math.PI / 180) * 0.6 * 0;
const pf = pointForecast(now, mf, px, py, 60);
// Truth: build the actual future frames and find when rain arrives at (px, py).
let truth = null;
for (let m = 0; m <= 60; m++) {
  const fut = makeField(stormFrame(cells, m, u, v), W, H, DX, T0 + m * 60000);
  if (fut.rate[Math.round(py) * W + Math.round(px)] >= RAIN_RATE) { truth = m; break; }
}
const predicted = pf.prob.findIndex((p) => p >= 0.5);
check('Point starts dry', pf.prob[0] < 0.1, `p=${pf.prob[0].toFixed(2)}`);
check('Arrival time within 4 min', truth !== null && predicted >= 0 && Math.abs(predicted - truth) <= 4,
  `predicted ${predicted} min, actual ${truth} min`);

// 4. Self-check scores tracking above "standing still"
const hc = hindcast(fields, 30, 150, 150, 60 / DX * 2);
check('Hindcast tracked beats persistence', hc && hc.tracked > hc.persistence && hc.tracked > 0.6,
  hc ? `tracked ${hc.tracked.toFixed(2)}, persistence ${hc.persistence.toFixed(2)}` : 'none');

// 5. No rain anywhere: no vectors, zero probability
const dry = series([], 0, 0, 7);
const mfDry = estimateMotion(dry);
const pfDry = pointForecast(dry[dry.length - 1], mfDry, 150, 150, 60);
check('Dry radar gives no motion and 0% chance', mfDry.count === 0 && Math.max(...pfDry.prob) === 0);

// 6. Stationary storm stays put
const still = series([{ x: 150, y: 150, rx: 25, ry: 25, peak: 45 }], 0, 0, 7);
const mfStill = estimateMotion(still);
const vs = velocity(mfStill, 150, 150);
check('Stationary storm reads as stationary', Math.hypot(vs.u, vs.v) * DX * 60 < 3,
  `${(Math.hypot(vs.u, vs.v) * DX * 60).toFixed(2)} km/h`);

// 6b. Rain start / stop times and their likely windows
{
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const mk = (fn) => Array.from({ length: 61 }, (_, m) => ({ m, prob: fn(m), intensity: 2 }));
  // A band of rain whose chance rises through 50% at minute 20 and falls through it at minute 45.
  const s = summarize(mk((m) => clamp((m - 14) / 12) * clamp((57 - m) / 12)), 'rain', false);
  check('Rain starts where the chance passes 50%', s.start === 20, s.start);
  check('Rain stops where the chance drops below 50% (not later)', s.stop === 52, s.stop);
  check('Start window brackets the start', s.startWin[0] < 20 && s.startWin[1] > 20, s.startWin.join('-'));
  check('Stop window brackets the stop', s.stopWin[0] < 52 && s.stopWin[1] > 52, s.stopWin.join('-'));
  const w5 = changeWindow(mk((m) => (m >= 5 ? 1 : 0)), 5, true), w40 = changeWindow(mk((m) => (m >= 40 ? 1 : 0)), 40, true);
  check('Windows widen with lead time', w40[1] - w40[0] > w5[1] - w5[0], `${w5.join('-')} vs ${w40.join('-')}`);
  const now = summarize(mk((m) => clamp((30 - m) / 10)), 'rain', false);
  check('Raining now, stopping at the 50% crossing', now.raining && now.stop === 26, now.stop);
}

// 7. Water clarity: Kd490 to visibility, matching Copernicus Marine's own Secchi depths
check('Kd 0.217 sees about 3.2 m (Copernicus 3.20)', Math.abs(visibilityM(0.217) - 3.2) < 0.3, visibilityM(0.217).toFixed(2));
check('Kd 0.046 sees about 19.8 m (Copernicus 19.80)', Math.abs(visibilityM(0.046) - 19.8) < 3, visibilityM(0.046).toFixed(1));
check('Visibility stays within 0.1-40 m', visibilityM(50) === 0.1 && visibilityM(0.001) === 40);
check('Clarity words', describe(12) === 'very clear' && describe(3) === 'fair' && describe(0.5) === 'very murky');
const s2day = (from, n, kd) => ({ interval: { from }, outputs: { kd: { bands: { B0: { stats: { sampleCount: 1000, noDataCount: 1000 - n, mean: kd, percentiles: { '50.0': kd } } } } } } });
const s2 = pickS2([s2day('2026-10-20T00:00:00Z', 500, 0.3), s2day('2026-10-25T00:00:00Z', 5, 0.9), s2day('2026-10-22T00:00:00Z', 300, 0.2)]);
check('Sentinel-2 takes the newest day with enough clear water', s2.kd === 0.2 && s2.t.startsWith('2026-10-22'), JSON.stringify(s2));
check('Sentinel-2 with no clear water says so', !!pickS2([s2day('2026-10-25T00:00:00Z', 0, 0)]).none);

// 8. Forecast history: last 7 days, measured vs NOAA and Navy day-ahead forecasts
{
  const now = Date.UTC(2026, 10, 2, 3, 30);   // Nov 1, 22:30 in New York (the night DST ended)
  const d = pastDays(now, 'America/New_York');
  check('History covers the 7 days before today', d.length === 7 && d[0] === '2026-10-25' && d[6] === '2026-10-31', d.join(' '));
  const lines = ['station,valid,tmpf,sknt,p01i'];
  for (let hr = 0; hr < 24; hr++) lines.push(`JAX,2026-10-30 ${String(hr).padStart(2, '0')}:56,${hr === 15 ? 80.6 : hr === 6 ? 59 : 68},${hr === 14 ? 20 : 5},${hr === 10 ? 'T' : hr === 11 ? '0.50' : '0.00'}`);
  lines.push('JAX,2026-10-31 00:56,M,M,M');
  const o = observedDaily(lines.join('\n'));
  const ob = o['2026-10-30'];
  check('Station high, low, rain and wind for a day', Math.abs(ob.hi - 27) < 0.01 && Math.abs(ob.lo - 15) < 0.01 && Math.abs(ob.rain - 12.7) < 0.01 && Math.abs(ob.wind - 37.04) < 0.01, JSON.stringify(ob));
  check('A day with too few reports is left out', !o['2026-10-31']);
  const time = [], T = [], P = [], W = [];
  for (let hr = 0; hr < 24; hr++) { time.push(`2026-10-30T${String(hr).padStart(2, '0')}:00`); T.push(20 + (hr === 15 ? 6 : 0)); P.push(hr === 9 ? 2.5 : 0); W.push(hr === 12 ? 30 : 10); }
  const nd = noaaDaily({ time, temperature_2m_previous_day1: T, precipitation_previous_day1: P, wind_speed_10m_previous_day1: W })['2026-10-30'];
  check('NOAA past forecast per day', nd.hi === 26 && nd.lo === 20 && nd.rain === 2.5 && nd.wind === 30, JSON.stringify(nd));
  // Four runs a day, steps 18/21/24: every 3-hourly time on Oct 30 (UTC) covered.
  const runs = [];
  for (let k = 0; k < 8; k++) {
    const base = new Date(Date.UTC(2026, 9, 29, 0) + k * 6 * 3600000).toISOString().replace('.000', '');
    runs.push({ base, series: { t2m: [293.15 + k, 293.15 + k, 293.15 + k], u10: [3, 4, 5], v10: [4, 3, 0], apcp: [1, null, 2] } });
  }
  const nv = navyHistDaily({ steps: [18, 21, 24], runs }, 'UTC')['2026-10-30'];
  check('Navy day-ahead forecast per day', nv && Math.abs(nv.lo - 21) < 1e-9 && Math.abs(nv.hi - 24) < 1e-9 && nv.rain === 8 && Math.abs(nv.wind - 18) < 1e-9, JSON.stringify(nv));
  const sc = scores([{ obs: { hi: 25, lo: 15, rain: 0, wind: 20 }, noaa: { hi: 26, lo: 15, rain: 1, wind: 20 }, navy: { hi: 22, lo: 16, rain: 0, wind: null } }]);
  check('Average miss per model', sc.noaa.hi.mae === 1 && sc.navy.hi.mae === 3 && sc.navy.rain.mae === 0 && sc.navy.wind === null);
}

const passed = results.filter(Boolean).length;
document.title = `${passed}/${results.length} passed`;
const h = document.createElement('h2');
h.textContent = `${passed}/${results.length} passed`;
document.body.appendChild(h);
</script>
</body>
</html>
